# MIDI-grep similarity eval gate.
#
# These are REGRESSION FLOORS: a render for a given genre must not score below its floor.
# They are code-authoritative — `scripts/python/tests/test_similarity_gate.py` asserts against
# them and fails pytest on a breach.
#
# Numbers are the HONEST `overall_similarity` from compare_audio.py (0.0–1.0), measured against a
# BlackHole render (NOT the Node.js synth - it reads ~16% and must not gate). Since 2026-10-18 overall =
# 0.5 * static (the old MAE-based time-averaged score) + 0.5 * temporal (time-aligned chroma / log-mel /
# onset F1 / RMS envelope). The per-MODE floors in `modes:` are on that new scale. The genre-wide
# `genres:` / `section_aware:` tables below are on the STATIC scale (measured before the temporal half
# existed, tracks not re-measurable): eval/gate.py compares them against `static_similarity` and the
# mean window `static` when a comparison carries them.
#
# Floors start at the current measured baselines (see CLAUDE.md / MEMORY) and are meant to
# ratchet UP toward the 0.80 target as AI learning improves — never down.

# Minimum a render must hit when the genre is unknown / unlisted.
default: 0.55

# Per-genre floors. Raise a floor only after a change reliably clears it.
genres:
  brazilian_funk:   0.62   # BlackHole baseline ~72%; floor below it to allow noise
  brazilian_phonk:  0.55
  electro_swing:    0.60   # measured ~67%
  russian_hip_hop:  0.52   # measured ~59%
  retro_wave:       0.55
  synthwave:        0.55
  trance:           0.55
  house:            0.55
  lofi:             0.55
  jazz:             0.50

# Long-term target (informational; not enforced per-run).
target: 0.80

# Hard guardrail: any single frequency band off by more than this fraction fails the gate
# regardless of overall score (mirrors compare_audio.py's per-band penalty).
max_worst_band_diff: 0.30

# Chance control (OPTIONAL - checked only when comparison.json carries `margin_over_chance`, i.e. it was
# scored with `compare_audio.py --control <different same-genre song>`): a render must beat a DIFFERENT
# same-genre song, scored against the same original by the same function, by more than the 0.02
# run-to-run noise margin already used for the floors below.
min_margin_over_chance: 0.02

# Section-aware floors (OPTIONAL — only checked when compare_audio.py produces
# section_aware_similarity in the comparison dict, i.e. >= Task C version).
#
# WHY SECTION-AWARE IS STRICTER THAN OVERALL:
#   overall_similarity averages all windows including the best-matching ones, so a
#   static loop that sounds identical to the original's chorus will score high overall
#   while badly failing the quiet intro or the breakdown.  section_aware_similarity
#   also averages windows but uses a tighter per-window formula (MFCC 40%, bands 35%,
#   energy 25%) with no partial credit from tempo/chroma inflation — so a render that
#   only matches one section will score noticeably lower here.
#
# WHY FLOORS ARE CONSERVATIVE (below overall floors):
#   The scale is different — section_aware uses a simpler per-window formula that
#   produces scores roughly 10-15% lower than overall_similarity on well-matched
#   renders.  Start low and ratchet up as the AI learns to cover all sections.
#
# Overall % will look higher than section_aware %; section_aware is the honest signal
# for temporal evolution coverage.
section_aware:
  default: 0.45  # Conservative global floor (~10% below default overall floor of 0.55)
  genres:
    brazilian_funk:   0.50  # Overall floor 0.62; section_aware ~10% below
    brazilian_phonk:  0.45
    electro_swing:    0.48  # Overall floor 0.60; measured section_aware ~55%
    russian_hip_hop:  0.42
    retro_wave:       0.45
    synthwave:        0.45
    trance:           0.45
    house:            0.45
    lofi:             0.45
    jazz:             0.40

# Per-MODE floors (spec 003 §2.2-E). `eval/gate.py` resolves `modes.<mode>.genres.<genre>`
# (and `modes.<mode>.section_aware.<genre>`) BEFORE the genre-wide `genres:` /
# `section_aware:` tables above; a genre/mode with no entry here falls back to those.
#
# Mode keys are normalised the same way as genres (`sample-instrument` → `sample_instrument`).
#
# RULE: every value here is a REGRESSION FLOOR taken from a real, detector-PASSING
# (editability: pass) BlackHole render of that mode: floor = measured − a stated margin, and
# the raw measurement + the run it came from is recorded under `measured:` so the number is
# reproducible. NEVER type a guessed value — leave the entry absent until it is measured
# (Slice 4 of context/spec/003-editable-strudel-generation/tasks.md fills it in).
#
# Shape (values intentionally absent until measured):
#   modes:
#     sample_instrument:
#       genres:        { <genre>: <measured − margin> }
#       section_aware: { <genre>: <measured − margin> }
#       measured:      { <genre>: { overall: <x>, section_aware: <y>, run: "<cache_key>/vNNN",
#                                   margin: <m> } }
#     synth:
#       genres:        { ... }
#       section_aware: { ... }
#       measured:      { ... }
modes:
  # 2026-10-18 RESCALE. compare_audio.py's overall_similarity / section_aware_similarity changed meaning:
  # overall = 0.5 * static + 0.5 * temporal, where static is the old time-averaged formula (unchanged) and
  # temporal is the time-aligned chroma / log-mel / onset-F1 / RMS-envelope score (spec 003 §2.4 divergence:
  # the old score could not tell a different same-genre song from the right one). The static-only floors below
  # were replaced; their old values and runs are kept here for history:
  #   sample_instrument: overall 0.88 / section_aware 0.90 (Regime CLT v026: 0.9009 / 0.9205; VAGABUNDO v004: 0.9320 / 0.9216)
  #   synth:             overall 0.77 / section_aware 0.81 (Regime CLT v027: 0.7879 / 0.8319; VAGABUNDO v007: 0.9393 / 0.8725)
  # Each floor is now round(min over the mode's reference tracks - 0.02, 2); `measured:` holds the BINDING
  # (lowest) track and `tracks:` lists every track re-scored with
  #   compare_audio.py <track>/original.wav <vNNN>/render.wav -d 135 -j --strudel <vNNN>/output.strudel \
  #       --control <other track>/original.wav
  # (`static` reproduces the old score exactly; `margin_over_chance` = overall - the control song's overall).
  # 2026-10-19 RE-BASELINE (fix instruments-short-grains-wrong-labels): refined tempo, note-aligned pitch-verified
  # instruments, OFFLINE renderer (BlackHole was ~2.5 semitones flat), no vocal voice, every score against
  # <track>/instrumental.wav (bass+drums+melodic) with the other track's instrumental.wav as --control.
  # Previous (2026-10-18, BlackHole, full-mix reference): sample_instrument 0.64/0.60 (VAGABUNDO v004 0.6626/0.6223),
  # synth 0.54/0.53 (Regime v027 0.5589/0.5525, margin -0.0182 FAIL).
  sample_instrument:
    genres:
      brazilian_funk: 0.70
    section_aware:
      brazilian_funk: 0.69
    measured:
      brazilian_funk:
        overall: 0.7217            # binding track: VAGABUNDO v010 (Regime v029: 0.7793)
        section_aware: 0.7074      # binding track: VAGABUNDO v010 (Regime v029: 0.7746)
        static: 0.8524
        temporal: 0.5909
        margin_over_chance: 0.1469
        frequency_balance: 0.7659
        tempo_similarity: 1.0000
        run: "VAGABUNDO NÃO NAMORA/v010"
        margin: 0.02
        editability: pass
        tracks:
          - { run: "Regime CLT (Dj Brunin XM, Aurora Shukita)/v029", overall: 0.7793, section_aware: 0.7746, static: 0.8746, temporal: 0.6841, margin_over_chance: 0.2044 }
          - { run: "VAGABUNDO NÃO NAMORA/v010", overall: 0.7217, section_aware: 0.7074, static: 0.8524, temporal: 0.5909, margin_over_chance: 0.1469 }
    # 2026-10-10 history (static scale) - VAGABUNDO v002 fell short on section-aware (0.8721 < 0.90); fix #10 (per-bar
    # bass/lead/master correction from the comparison's section_windows) -> v004.
  synth:
    # Pure palette synthesis (no stem samples) - inherently further from the master.
    genres:
      brazilian_funk: 0.65
    section_aware:
      brazilian_funk: 0.63
    measured:
      brazilian_funk:
        overall: 0.6705            # binding track: Regime CLT v030 (VAGABUNDO v011: 0.7393)
        section_aware: 0.6519      # binding track: Regime CLT v030 (VAGABUNDO v011: 0.6907)
        static: 0.8812
        temporal: 0.4599
        margin_over_chance: 0.0955
        frequency_balance: 0.8674
        tempo_similarity: 0.8830
        run: "Regime CLT (Dj Brunin XM, Aurora Shukita)/v030"
        margin: 0.02
        editability: pass
        tracks:
          - { run: "Regime CLT (Dj Brunin XM, Aurora Shukita)/v030", overall: 0.6705, section_aware: 0.6519, static: 0.8812, temporal: 0.4599, margin_over_chance: 0.0955 }
          - { run: "VAGABUNDO NÃO NAMORA/v011", overall: 0.7393, section_aware: 0.6907, static: 0.8668, temporal: 0.6119, margin_over_chance: 0.1645 }
    # 2026-10-10 history (static scale) - VAGABUNDO v003 (sample-instrument knobs on synth) 0.7209 / 0.7520, worst band 30.07%;
    # fix #11 (own synth calibration pass) -> v007.
