  #       --control <other track>/original.wav
  # (`static` reproduces the old score exactly; `margin_over_chance` = overall - the control song's overall).
  # 2026-10-19 RE-BASELINE (fix instruments-short-grains-wrong-labels): refined tempo, note-aligned pitch-verified
  # instruments, OFFLINE renderer (BlackHole was ~2.5 semitones flat), no vocal voice, every score against
  # <track>/instrumental.wav (bass+drums+melodic) with the other track's instrumental.wav as --control.
  # 2026-10-19 fix compare-alignment-one-bar-off: Regime v032 had been scored one bar mis-aligned (0.6709/0.6523);
  # re-scored 0.7479/0.7361; binding synth track is now VAGABUNDO v014 (0.7240/0.7007) -> synth floors 0.65/0.63 ->
  # 0.70/0.68 (owner decision: follow the derivation rule; the old synth numbers were measured one bar off).
  # Previous (2026-10-18, BlackHole, full-mix reference): sample_instrument 0.64/0.60 (VAGABUNDO v004 0.6626/0.6223),
  # synth 0.54/0.53 (Regime v027 0.5589/0.5525, margin -0.0182 FAIL).
  # 2026-10-23 RE-BASELINE (older versions were deleted from the cache): sample-instrument Regime v057 / VAGABUNDO v036,
  # synth Regime v058 / VAGABUNDO v035; floors raised by the same rule. previous floors: sample 0.70/0.69, synth 0.70/0.68
  # (VAGABUNDO v013 0.7170/0.7073, v014 0.7240/0.7007; Regime v031 0.7794/0.7744, v032 0.7479/0.7361).
