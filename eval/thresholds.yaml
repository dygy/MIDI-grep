  # (VAGABUNDO v035 0.8069/0.7645, Regime v058 0.8823/0.8698).
  # 2026-10-29 DETERMINISTIC RENDERER: all eight reference renders re-made on the seeded renderer (ducks on time,
  # reverb IR fixed); same rule -> sample 0.85/0.83 (unchanged), synth 0.78/0.76 -> 0.78/0.78 (binding DBB v011).
  # 2026-10-28 FOUR REFERENCE TRACKS (owner decision): "Dumb Blond Bitches" and "Automotivo XM, Taka Taka Taka Tá (Dj Brunin XM" joined the dataset (PR #24
  # generalisation fixes). Same rule, round(min over the four tracks - 0.02, 2): sample 0.86/0.83 -> 0.85/0.83,
  # synth 0.81/0.78 -> 0.78/0.76; the binding tracks are now the new ones.
  # 2026-10-31 RE-BASELINE (every gated version was deleted from the cache in a disk clean-up): all eight rebuilt on
  # main ef309ee (PR #33 bass + #35 genre re-stamp). Same rule -> sample 0.85/0.83 -> 0.85/0.84 (binding DBB v019,
  # VAGABUNDO v072), synth 0.78/0.78 -> 0.79/0.77 (binding DBB v020 0.8094/0.7938; the section floor drops 0.01 because
  # DBB section-aware moved 0.7954 -> 0.7938, -0.0016, inside calibration noise). previous binding: sample DBB v010
  # 0.8714 / VAGABUNDO v060 0.8539, synth DBB v011 0.8026/0.7954.
  sample_instrument:
    genres:
      brazilian_funk: 0.85
    section_aware:
      brazilian_funk: 0.84
    measured:
