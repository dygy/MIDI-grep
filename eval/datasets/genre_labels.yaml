# Owner-provided genre labels: cache_key (the directory name under .cache/stems) -> genre.
#
# These are the SOURCE OF TRUTH for the genre of a track (pipeline stage 1b, scripts/python/genre_knn.py):
#   precedence = --genre override > this registry > kNN on audio embeddings against these labelled tracks > CLAP.
# The labelled tracks are also the reference set a NEW track is compared with (leave-one-out within-genre spread),
# so adding a labelled track makes every later classification better supported. A genre needs >= 2 labelled
# tracks before a new track can be assigned to it by kNN (one member gives no within-genre spread).
#
# This file is only about genre. eval/datasets/reference_tracks.yaml stays the similarity-gate dataset (versions,
# measured scores); a track can be labelled here without being a gate reference (e.g. retro_wave has no floors).
