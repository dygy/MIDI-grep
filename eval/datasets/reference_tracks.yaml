# Reference-track dataset for the similarity eval gate.
#
# Each entry pins a known track to its genre and points at a comparison.json produced by a
# real (BlackHole) render. The gate test (scripts/python/tests/test_similarity_gate.py) loads
# this list and asserts each track's overall_similarity clears its genre floor in thresholds.yaml.
#
# How to add a track:
#   1. Run an extraction that produces a BlackHole render + comparison:
#        ./bin/midi-grep extract --url "..." --genre electro_swing
#   2. Find the resulting comparison.json under .cache/stems/<key>/vNNN/comparison.json
#   3. Add an entry below. `comparison` may be:
#        - a path relative to repo root, OR
#        - `cache_key` + `version` (the test resolves .cache/stems/<cache_key>/<version>/comparison.json)
#
# Entries whose comparison.json is missing are SKIPPED (not failed) so a fresh checkout's gate
# stays green until you've generated renders locally. Commit small/curated comparison.json copies
# under eval/datasets/fixtures/ if you want the gate to run in CI without the cache.

tracks:
  - name: "Regime CLT (Dj Brunin XM, Aurora Shukita)"
    genre: brazilian_funk
    mode: sample-instrument
    cache_key: "Regime CLT (Dj Brunin XM, Aurora Shukita)"
    version: v077
    expected: pass               # deterministic renderer 2026-10-29 (was v069)
    # offline renderer, no vocal voice, scored vs instrumental.wav. previous: v057 0.8181 / 0.8043, v031 0.7794 / 0.7744
    measured: { overall: 0.9081, section_aware: 0.9042, static: 0.9641, temporal: 0.8520, margin_over_chance: 0.3319 }
  - name: "Regime CLT (Dj Brunin XM, Aurora Shukita) — synth mode"
    genre: brazilian_funk
    mode: synth
    cache_key: "Regime CLT (Dj Brunin XM, Aurora Shukita)"
    version: v078
    expected: pass               # deterministic renderer 2026-10-29 (was v070); previous: v058 0.8823 / 0.8698; v032 0.7479 / 0.7361 (v027, BlackHole, failed the chance margin: history only). v056 (0.8803 / 0.8741) scored lower.
    measured: { overall: 0.9136, section_aware: 0.9038, static: 0.9695, temporal: 0.8576, margin_over_chance: 0.3374 }
