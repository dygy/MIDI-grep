  # - name: "Some Funk Track"
  #   genre: brazilian_funk
  #   comparison: eval/datasets/fixtures/some-funk-comparison.json
  - name: "VAGABUNDO NÃO NAMORA (Christopher Luz)"
    genre: brazilian_funk
    mode: sample-instrument
    cache_key: "VAGABUNDO NÃO NAMORA"
    version: v036
    expected: pass               # offline renderer, no vocal voice, scored vs instrumental.wav. previous: v013 0.7170 / 0.7073
    measured: { overall: 0.8195, section_aware: 0.7886, static: 0.9455, temporal: 0.6935, margin_over_chance: 0.2445 }
  - name: "VAGABUNDO NÃO NAMORA (Christopher Luz) — synth mode"
    genre: brazilian_funk
    mode: synth
    cache_key: "VAGABUNDO NÃO NAMORA"
    version: v035
    expected: pass               # previous: v014 0.7240 / 0.7007. v035 chosen over v037 (0.8066 / 0.7642): it scores higher.
    measured: { overall: 0.8069, section_aware: 0.7645, static: 0.9328, temporal: 0.6809, margin_over_chance: 0.2319 }
