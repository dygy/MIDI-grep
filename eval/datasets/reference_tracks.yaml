# Reference-track dataset for the similarity eval gate.
#
# Each entry pins a known track to its genre and points at a comparison.json produced by a
# real (BlackHole) render. The gate test (scripts/python/tests/test_similarity_gate.py) loads
# this list and asserts each track's overall_similarity clears its genre floor in thresholds.yaml.
#
# How to add a track:
#   1. Run an extraction that produces a BlackHole render + comparison:
#        ./bin/midi-grep extract --url "..." --genre electro_swing
#   2. Find the resulting comparison.json under .cache/stems/<key>/vNNN/comparison.json
#   3. Add an entry below. `comparison` may be:
#        - a path relative to repo root, OR
#        - `cache_key` + `version` (the test resolves .cache/stems/<cache_key>/<version>/comparison.json)
#
# Entries whose comparison.json is missing are SKIPPED (not failed) so a fresh checkout's gate
# stays green until you've generated renders locally. Commit small/curated comparison.json copies
# under eval/datasets/fixtures/ if you want the gate to run in CI without the cache.

tracks:
  - name: "Regime CLT (Dj Brunin XM, Aurora Shukita)"
    genre: brazilian_funk
    mode: sample-instrument
    cache_key: "Regime CLT (Dj Brunin XM, Aurora Shukita)"
    version: v031
    expected: pass
    # 2026-10-19: offline renderer, note-aligned verified instruments, no vocal voice, scored vs instrumental.wav.
    # Previous: v026 (BlackHole, vocal voice, full-mix reference) 0.6967 / 0.6736.
    measured: { overall: 0.7794, section_aware: 0.7744, static: 0.8747, temporal: 0.6841, margin_over_chance: 0.2044 }
  - name: "Regime CLT (Dj Brunin XM, Aurora Shukita) — synth mode"
    genre: brazilian_funk
    mode: synth
    cache_key: "Regime CLT (Dj Brunin XM, Aurora Shukita)"
    version: v032
    expected: pass               # 2026-10-19: v027 (margin -0.0182, a different song scored higher) was a recorded shortfall on the BlackHole
                                 # renderer (~2.5 semitones flat) with the full-mix reference; v032 = offline renderer, refined tempo, no vocals.
    measured: { overall: 0.6709, section_aware: 0.6523, static: 0.8815, temporal: 0.4603, margin_over_chance: 0.0959 }
  # - name: "Caravan Palace - Lone Digger"
  #   genre: electro_swing
  #   cache_key: "Caravan Palace - Lone Digger (Official MV)"
  #   version: v002
  #
  # - name: "Some Funk Track"
  #   genre: brazilian_funk
  #   comparison: eval/datasets/fixtures/some-funk-comparison.json
  - name: "VAGABUNDO NÃO NAMORA (Christopher Luz)"
    genre: brazilian_funk
    mode: sample-instrument
    cache_key: "VAGABUNDO NÃO NAMORA"
    version: v013
    expected: pass               # 2026-10-19: offline renderer, note-aligned verified instruments, no vocal voice, scored vs instrumental.wav.
                                 # Previous: v004 (BlackHole, full-mix reference) 0.6626 / 0.6223.
    measured: { overall: 0.7170, section_aware: 0.7073, static: 0.8408, temporal: 0.5932, margin_over_chance: 0.1422 }
  - name: "VAGABUNDO NÃO NAMORA (Christopher Luz) — synth mode"
    genre: brazilian_funk
    mode: synth
    cache_key: "VAGABUNDO NÃO NAMORA"
    version: v014
    expected: pass               # 2026-10-19: offline renderer, refined tempo, no vocal voice; previous v007 (BlackHole) 0.6627 / 0.5860.
    measured: { overall: 0.7240, section_aware: 0.7007, static: 0.8352, temporal: 0.6128, margin_over_chance: 0.1492 }
