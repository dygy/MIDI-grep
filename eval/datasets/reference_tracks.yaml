# Reference-track dataset for the similarity eval gate.
#
# Each entry pins a known track to its genre and points at a comparison.json produced by a
# real (BlackHole) render. The gate test (scripts/python/tests/test_similarity_gate.py) loads
# this list and asserts each track's overall_similarity clears its genre floor in thresholds.yaml.
#
# How to add a track:
#   1. Run an extraction that produces a BlackHole render + comparison:
#        ./bin/midi-grep extract --url "..." --genre electro_swing
#   2. Find the resulting comparison.json under .cache/stems/<key>/vNNN/comparison.json
#   3. Add an entry below. `comparison` may be:
#        - a path relative to repo root, OR
#        - `cache_key` + `version` (the test resolves .cache/stems/<cache_key>/<version>/comparison.json)
#
# Entries whose comparison.json is missing are SKIPPED (not failed) so a fresh checkout's gate
# stays green until you've generated renders locally. Commit small/curated comparison.json copies
# under eval/datasets/fixtures/ if you want the gate to run in CI without the cache.

tracks:
  - name: "Regime CLT (Dj Brunin XM, Aurora Shukita)"
    genre: brazilian_funk
    mode: sample-instrument
    cache_key: "Regime CLT (Dj Brunin XM, Aurora Shukita)"
    version: v026
    expected: pass
    # Detector-passing render (editable vocal), raw-capture recorder, tempo 1.000.
    # 2026-10-18 rescaled (0.5 static + 0.5 temporal); static-only was 0.9009 / 0.9205.
    measured: { overall: 0.6967, section_aware: 0.6736, static: 0.9009, temporal: 0.4925, margin_over_chance: 0.1196 }
  - name: "Regime CLT (Dj Brunin XM, Aurora Shukita) — synth mode"
    genre: brazilian_funk
    mode: synth
    cache_key: "Regime CLT (Dj Brunin XM, Aurora Shukita)"
    version: v027
    expected: shortfall          # 2026-10-18: margin over chance -0.0182 < min_margin_over_chance 0.02 - a DIFFERENT song (VAGABUNDO) scores
                                 # higher against the Regime original than this render does. Floor not lowered; the shortfall is the finding.
    # Pure-synth render (palette sounds, no samples()), raw-capture recorder. Static-only was 0.7879 / 0.8319.
    measured: { overall: 0.5589, section_aware: 0.5525, static: 0.7879, temporal: 0.3298, margin_over_chance: -0.0182 }
  # - name: "Caravan Palace - Lone Digger"
  #   genre: electro_swing
  #   cache_key: "Caravan Palace - Lone Digger (Official MV)"
  #   version: v002
  #
  # - name: "Some Funk Track"
  #   genre: brazilian_funk
  #   comparison: eval/datasets/fixtures/some-funk-comparison.json
  - name: "VAGABUNDO NÃO NAMORA (Christopher Luz)"
    genre: brazilian_funk
    mode: sample-instrument
    cache_key: "VAGABUNDO NÃO NAMORA"
    version: v004
    expected: pass               # 2026-10-10 fix #10: v002 was a recorded shortfall (0.9282 / 0.8721 < 0.90); v004 = same global knobs + the
                                 # per-bar bass/lead/master correction measured from v002's section_windows → 0.9320 / 0.9216. Floors unchanged.
    # 2026-10-18 rescaled; static-only was 0.9320 / 0.9216.
    measured: { overall: 0.6626, section_aware: 0.6223, static: 0.9320, temporal: 0.3933, margin_over_chance: 0.0860 }
  - name: "VAGABUNDO NÃO NAMORA (Christopher Luz) — synth mode"
    genre: brazilian_funk
    mode: synth
    cache_key: "VAGABUNDO NÃO NAMORA"
    version: v007
    expected: pass               # 2026-10-11 fix #11: v003 (0.7209 / 0.7520, worst band 30.07%) was ONE synth render with the sample-instrument
                                 # knobs; v007 = auto-calibrate --mode synth (own knobs: bass-lpf 422, lead-hpf 500, hats 0.135, vocal +1 octave
                                 # from the measured register) → 0.9393 / 0.8725, worst band 8.41%. Floors unchanged.
    # 2026-10-18 rescaled; static-only was 0.9393 / 0.8725.
    measured: { overall: 0.6627, section_aware: 0.5860, static: 0.9393, temporal: 0.3862, margin_over_chance: 0.0861 }
